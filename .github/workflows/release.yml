name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package extension
        run: |
          cd onlyfans-media-downloader
          zip -r ../of-media-downloader.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: of-media-downloader.zip
          generate_release_notes: true
